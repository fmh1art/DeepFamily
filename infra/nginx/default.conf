server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        include /etc/nginx/proxy-common.conf;
    }

    location = /readyz {
        include /etc/nginx/proxy-common.conf;
    }

    location = /api/v1/runs {
        client_max_body_size 16k;
        limit_req zone=runs_per_ip burst=10 nodelay;
        limit_conn api_connections 3;
        include /etc/nginx/proxy-common.conf;
    }

    location /api/ {
        client_max_body_size 16k;
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn api_connections 8;
        include /etc/nginx/proxy-common.conf;
    }

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header Retry-After 5 always;
        return 429 '{"detail":"Too many requests; retry shortly."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
