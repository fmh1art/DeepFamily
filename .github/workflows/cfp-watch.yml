name: VLDB 2027 CFP watch

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vldb-2027-cfp-watch
  cancel-in-progress: true

jobs:
  official-state:
    name: Compare official VLDB state with reviewed snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install "3.10.20"

      - name: Check official CFP, dates, formatting guidance, and template
        run: make cfp-status
