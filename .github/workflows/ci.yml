name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.1"
  PYTHON_VERSION: "3.10.20"
  NODE_VERSION: "24.20.0"
  HUGGINGFACE_HUB_VERSION: "1.0.1"
  HELDOUT_FREEZE_SHA256: "6baa554fa5a4a08ef2e1c1a2048248624e4cc5071f5110209652075862b95092"

jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          make backend-sync
          make frontend-install

      - name: Install artifact and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils ripgrep

      - name: Build the generated paper prerequisites used by source tests
        run: make pdf-modern

      - name: Run static checks and tests
        run: make quality

  artifact-smoke:
    name: Evidence, production, and artifact smoke test
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils ripgrep zstd

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and data CLI
        run: |
          uv python install "$PYTHON_VERSION"
          uv tool install "huggingface_hub==$HUGGINGFACE_HUB_VERSION"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch checksum-pinned public pilot assets
        run: make pilot-assets

      - name: Install locked project dependencies
        run: |
          make backend-sync
          make frontend-install

      - name: Validate guarded ECS ingress and lifecycle templates
        run: make ecs-config-check

      - name: Verify provider HTTP contract without credentials
        run: make provider-contract

      - name: Reproduce and assert reported evidence
        run: make experiment-all

      - name: Guard the blinded evaluation surface
        run: test "$(./scripts/hash_evaluation_surface.sh)" = "$HELDOUT_FREEZE_SHA256"

      - name: Install browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Exercise the browser-to-model closed loop without credentials
        run: make provider-browser-smoke

      - name: Test the production Compose path
        run: make e2e

      - name: Exercise runtime backup and fresh-volume restore
        run: make ecs-runtime-snapshot-smoke

      - name: Check production dependency-license inventory
        run: make dependency-license-audit

      - name: Reject fixable High/Critical production-image vulnerabilities
        run: make image-vulnerability-audit

      - name: Build and inspect the paper
        run: |
          make pdf-modern
          make draft-check

      - name: Assert deterministic sanitized packaging
        run: make artifact-verify
