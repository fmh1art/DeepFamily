[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ask-dont-upload"
version = "0.4.0"
description = "Closed-loop question-only analytics research prototype"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Proprietary research prototype"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "ijson>=3.3,<4",
  "numpy>=1.26,<3",
  "openai>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "xlrd>=2,<3",
]

[project.scripts]
askdu = "askdu.cli:app"

[dependency-groups]
dev = [
  "matplotlib>=3.9,<4",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/askdu"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires downloaded research data",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["askdu"]
